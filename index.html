<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#18213a;--muted:#5d6681;--line:#dde2ea;--accent:#e0911b;--river:#1f6f78;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1424;--surface:#182037;--ink:#e8ebf4;--muted:#9aa3bd;--line:#2a3452;--accent:#f0a83a;--river:#5fb7c0;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:"Familjen Grotesk",system-ui,sans-serif;font-size:26px;margin:0;line-height:1.15}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:600}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>

</form>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveRaw(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toLowerCase()),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:ub(SALT),iterations:ITER,hash:"SHA-256"},base,256));
}
async function openWith(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(IV)},key,ub(DATA));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async()=>{ try{ const k=localStorage.getItem(KEYNAME); if(k){ await openWith(ub(k)); return; } }catch(e){ try{localStorage.removeItem(KEYNAME)}catch{} } document.getElementById("pw").focus(); })();
document.getElementById("f").addEventListener("submit", async e=>{
  e.preventDefault(); const go=document.getElementById("go"), err=document.getElementById("err");
  go.disabled=true; go.textContent="Opening…"; err.textContent="";
  try{
    const remember=document.getElementById("rem").checked;
    const raw=await deriveRaw(document.getElementById("pw").value);
    const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(IV)},key,ub(DATA)); // throws if wrong
    const kb=btoa(String.fromCharCode(...raw));
    try{ sessionStorage.setItem(KEYNAME, kb); }catch{}
    if(remember){ try{ localStorage.setItem(KEYNAME, kb); }catch{} }
    await openWith(raw);
  }catch(x){ go.disabled=false; go.textContent="Open"; err.textContent="That password isn't right. Try again."; }
});
